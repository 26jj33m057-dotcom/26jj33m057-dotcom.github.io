<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가나디 꾸미기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff1f5,#fff9e9 55%,#e8f6ff);font-family:system-ui,'Noto Sans KR',sans-serif;color:#51464d;padding:16px}.wrap{max-width:850px;margin:auto}.top{text-align:center}.top h1{margin:4px;color:#ed91aa;font-size:30px}.top p{margin:4px 0 16px;color:#927d86;font-size:13px}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.panel{background:#ffffffdf;border:2px solid white;border-radius:24px;padding:14px;box-shadow:0 9px 28px #b9899a20}.stage{height:410px;border-radius:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e3f6ff 0 65%,#d5efc8 65%);transition:background .2s}.stage:before{content:'☁️';position:absolute;left:20px;top:20px;font-size:30px}.stage:after{content:'☀️';position:absolute;right:22px;top:18px;font-size:34px}.ground{position:absolute;bottom:0;width:100%;height:34%;background:linear-gradient(transparent,#b7df9e)}.dog{position:relative;width:250px;height:270px;z-index:2;display:flex;align-items:center;justify-content:center}.dog img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 5px 2px #8b7c6820)}.layer{position:absolute;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center}.hat{top:4px;left:50%;transform:translateX(-50%);font-size:58px}.clothes{bottom:40px;left:50%;transform:translateX(-50%);font-size:66px}.faceacc{top:105px;right:8px;font-size:35px}.held{bottom:8px;right:-5px;font-size:48px}.name{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:white;border:2px solid #f4d4df;border-radius:30px;padding:5px 17px;font-weight:900;color:#dc86a1;z-index:5}.speech{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:white;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:800;z-index:6;white-space:nowrap}.controls h3{margin:2px 0 10px;font-size:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab,.item,.action{border:0;cursor:pointer;font:inherit;font-weight:800}.tab{background:#f8edf1;color:#9b7886;border-radius:20px;padding:8px 12px;font-size:12px}.tab.active{background:#f6bfd0;color:#784a5b}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{background:#fff8fb;border:2px solid #f5dce6;border-radius:15px;padding:9px 4px;color:#715963;min-height:76px}.item b{display:block;font-size:30px;margin-bottom:2px}.item small{font-size:11px}.item.selected{border-color:#e98eae;background:#fff0f5}.actions{display:flex;gap:7px;margin-top:12px}.action{flex:1;border-radius:13px;padding:11px 5px;background:#ffe8b8;color:#88632e;font-size:13px}.action.pink{background:#ffe1eb;color:#a25372}.hint{text-align:center;color:#a18b94;font-size:11px;margin-top:10px}@media(max-width:650px){.layout{grid-template-columns:1fr}.stage{height:360px}.dog{transform:scale(.9)}} 
</style></head><body><main class="wrap"><header class="top"><h1>🐶 가나디 꾸미기</h1><p>오늘은 가나디를 어떤 모습으로 꾸며줄까? 마음대로 골라봐! ✨</p></header><div class="layout"><section class="panel"><div class="stage" id="stage"><div class="ground"></div><div class="speech" id="speech">나 오늘 멋있지…?</div><div class="dog"><img src="https://ilovecharacter.com/news/data/20250501/p1065572674315832_435_thum.png" alt="가나디 공식 캐릭터 일러스트"><div class="layer hat" id="hat"></div><div class="layer clothes" id="clothes"></div><div class="layer faceacc" id="faceacc"></div><div class="layer held" id="held"></div></div><div class="name">가나디</div></div><div class="hint">꾸미기 아이템을 누르면 바로 적용돼! 💗</div></section><section class="panel controls"><h3>🎀 꾸미기 아이템</h3><div class="tabs" id="tabs"><button class="tab active" data-cat="hat">모자</button><button class="tab" data-cat="clothes">옷</button><button class="tab" data-cat="faceacc">얼굴 꾸미기</button><button class="tab" data-cat="held">소품</button><button class="tab" data-cat="bg">배경</button></div><div class="items" id="items"></div><div class="actions"><button class="action" id="random">🎲 랜덤 꾸미기</button><button class="action pink" id="reset">↩️ 초기화</button></div><div class="actions"><button class="action" id="say">💬 가나디 리액션</button><button class="action pink" id="save">💾 꾸민 모습 저장</button></div></section></div></main>
<script>
const data={hat:[['없음',''],['리본','🎀'],['딸기 모자','🍓'],['왕관','👑'],['토끼 귀','🐰'],['꽃 머리띠','🌼'],['곰돌이 모자','🐻'],['마법사 모자','🧙']],clothes:[['없음',''],['핑크 원피스','👗'],['후드티','🧥'],['교복','🎓'],['잠옷','🩷'],['천사 옷','😇'],['공주 드레스','💖'],['우비','🌂']],faceacc:[['없음',''],['하트 안경','🩷'],['선글라스','🕶️'],['볼터치','🌸'],['별 스티커','⭐'],['마스크','😷']],held:[['없음',''],['딸기','🍓'],['꽃다발','💐'],['하트 풍선','🎈'],['아이스크림','🍦'],['인형','🧸'],['마이크','🎤']],bg:[['하늘 정원','linear-gradient(#e3f6ff 0 65%,#d5efc8 65%)'],['핑크 방','linear-gradient(#ffe3ef 0 65%,#f8cfe0 65%)'],['바닷가','linear-gradient(#a9e5ff 0 65%,#f7e2ae 65%)'],['밤하늘','linear-gradient(#34365e 0 65%,#7776a8 65%)'],['라벤더','linear-gradient(#e9e0ff 0 65%,#c7b5e8 65%)'],['노을','linear-gradient(#ffc9a8 0 65%,#f3c58d 65%)']]};
let chosen={hat:0,clothes:0,faceacc:0,held:0,bg:0},cat='hat';
function render(){document.querySelectorAll('.layer').forEach(el=>{let key=el.id;el.textContent=data[key][chosen[key]][1]});document.getElementById('stage').style.background=data.bg[chosen.bg][1];}
function showItems(){const box=document.getElementById('items');box.innerHTML='';data[cat].forEach((it,i)=>{let b=document.createElement('button');b.className='item'+(chosen[cat]===i?' selected':'');b.innerHTML=cat==='bg'?'<b>🖼️</b><small>'+it[0]+'</small>':'<b>'+(it[1]||'✖️')+'</b><small>'+it[0]+'</small>';b.onclick=()=>{chosen[cat]=i;render();showItems()};box.appendChild(b)})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));showItems()});
document.getElementById('random').onclick=()=>{Object.keys(data).forEach(k=>chosen[k]=Math.floor(Math.random()*data[k].length));render();showItems();document.getElementById('speech').textContent='짜잔! 오늘의 랜덤 패션! ✨'};
document.getElementById('reset').onclick=()=>{Object.keys(chosen).forEach(k=>chosen[k]=0);render();showItems();document.getElementById('speech').textContent='처음 모습으로 돌아왔어!'};
const lines=['나 안아… 🥺','오늘 꾸미기 성공…','귀엽다고 해줘…','간식도 주라… 🍓','나 오늘 주인공… ✨','헤헤… 마음에 들어…'];document.getElementById('say').onclick=()=>document.getElementById('speech').textContent=lines[Math.floor(Math.random()*lines.length)];
document.getElementById('save').onclick=()=>{const text='가나디 꾸미기 결과\n'+Object.keys(chosen).map(k=>k+': '+data[k][chosen[k]][0]).join('\n');const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='가나디_꾸미기.txt';a.click();URL.revokeObjectURL(a.href);document.getElementById('speech').textContent='내 꾸미기 기록 저장 완료! 💗'};
render();showItems();
</script></body></html>
