<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>먼작귀 친구들 키우기</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(160deg,#fff0f5,#fff9df 55%,#e4f7f2);font-family:system-ui,"Noto Sans KR",sans-serif;color:#51445b}.app{max-width:600px;margin:auto}.head{text-align:center}.head h1{color:#ed82a8;margin:3px}.head p{font-size:13px;color:#927b8e;margin:4px 0 12px}.panel{background:#ffffffdf;border:2px solid white;border-radius:24px;padding:13px;box-shadow:0 10px 28px #b87d9b22}.stats,.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#fff4f7;border-radius:14px;padding:8px;text-align:center}.stat small{display:block;color:#a17d91;font-size:11px}.stat b{color:#dc79a0;font-size:18px}.room{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#dff5ff 0 60%,#bce9b7 60%);height:285px;display:flex;align-items:center;justify-content:center;user-select:none}.sun{position:absolute;right:22px;top:16px;font-size:35px}.cloud{position:absolute;left:20px;top:25px;font-size:33px}.petwrap{z-index:2;display:flex;flex-direction:column;align-items:center}.pet{width:190px;height:190px;position:relative;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 7px 2px #8d8b6c33);display:flex;align-items:center;justify-content:center}.pet img{width:100%;height:100%;object-fit:contain;position:relative;z-index:2}.pet .ear,.pet .body,.pet .face{display:none}.body{position:absolute;left:18px;right:18px;bottom:8px;height:138px;border-radius:48% 48% 43% 43%;background:#fffdf5;border:3px solid #e7d9cf}.ear{position:absolute;top:3px;width:45px;height:76px;background:#fffdf5;border:3px solid #e7d9cf;border-radius:60% 60% 40% 40%}.ear.l{left:29px;transform:rotate(-20deg)}.ear.r{right:29px;transform:rotate(20deg)}.face{position:absolute;inset:0}.eye{position:absolute;top:78px;width:8px;height:11px;background:#51464b;border-radius:50%}.eye.l{left:55px}.eye.r{right:55px}.cheek{position:absolute;top:91px;width:18px;height:9px;border-radius:50%;background:#ffb6bd}.cheek.l{left:34px}.cheek.r{right:34px}.mouth{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:18px;color:#68545a;font-weight:900}.pet.hachi .body:before{content:"";position:absolute;left:0;right:0;top:0;height:55px;border-radius:60% 60% 20% 20%;background:#5d9ee9}.pet.hachi .ear{background:#5d9ee9}.pet.usagi .body{background:#fff9c9}.pet.usagi .ear{height:105px;width:34px;top:-32px;background:#fff9c9}.pet.usagi .ear.l{transform:rotate(-12deg)}.pet.usagi .ear.r{transform:rotate(12deg)}.petname{background:white;border:2px solid #f8dbe7;border-radius:20px;padding:4px 14px;font-weight:900;color:#d7779a;margin-top:-1px}.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:white;border-radius:15px;padding:7px 12px;font-size:13px;font-weight:750;z-index:4;display:none;white-space:nowrap}.bubble.show{display:block}.tip{text-align:center;font-size:12px;color:#977c8f;margin:8px}.section{font-weight:900;margin:12px 2px 7px}.choice{border:2px solid #f5dce7;border-radius:14px;background:#fff8fb;padding:8px 4px;font:inherit;font-weight:800;color:#77596b;cursor:pointer}.choice img{display:block;width:58px;height:58px;object-fit:contain;margin:0 auto 3px}.choice{font-size:12px}.choice.active{border-color:#f18bb0;background:#fff0f6}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.act{border:0;border-radius:14px;padding:10px 3px;background:#fff0d7;color:#8b653b;font:inherit;font-weight:850;cursor:pointer;touch-action:manipulation}.act span{display:block;font-size:23px}.act:active,.choice:active{transform:scale(.96)}.meters{display:grid;gap:8px;margin-top:12px}.meter{display:grid;grid-template-columns:60px 1fr 30px;gap:7px;align-items:center;font-size:12px;font-weight:800}.bar{height:13px;background:#f2e8ee;border-radius:20px;overflow:hidden}.fill{height:100%;width:70%;border-radius:20px;background:linear-gradient(90deg,#ff9bbd,#ffd078);transition:width .2s}.log{background:#fff8fb;border-radius:13px;padding:10px;margin-top:12px;min-height:40px;font-size:13px;color:#8d6b7d;text-align:center}
</style></head><body><main class="app"><header class="head"><h1>🐾 먼작귀 꼬마 펫 키우기</h1><p>먼작귀 공식 캐릭터 친구들을 골라 돌봐줘! 💗</p></header><section class="panel">
<div class="stats"><div class="stat"><small>❤️ 애정 레벨</small><b id="level">Lv. 1</b></div><div class="stat"><small>⭐ 경험치</small><b id="xp">0 / 30</b></div><div class="stat"><small>🪙 코인</small><b id="coins">20</b></div></div>
<div class="room"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="bubble" id="bubble">쓰담쓰담 좋아!</div><div class="petwrap"><div class="pet chi" id="pet"><div class="ear l"></div><div class="ear r"></div><div class="body"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><div class="mouth" id="mouth">ω</div></div></div><div class="petname" id="petName">치이카와</div></div></div>
<div class="tip">👇 캐릭터를 직접 터치하거나 길게 쓰다듬어 봐!</div><div class="section">🌷 먼작귀 친구 고르기</div><div class="choices"><button class="choice active" data-pet="chi"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Chiikawa.oi0RVduO.png" alt="치이카와">치이카와</button><button class="choice " data-pet="hachi"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Hachiware.OfZO944x.png" alt="하치와레">하치와레</button><button class="choice " data-pet="usagi"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Usagi.Chj2eKjw.png" alt="우사기">우사기</button><button class="choice " data-pet="momonga"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Momonga.BiBEJv7n.png" alt="모몽가">모몽가</button><button class="choice " data-pet="kuri"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Kurimanju.ujk7zWOw.png" alt="쿠리만쥬">쿠리만쥬</button><button class="choice " data-pet="rakko"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Rakko.BT9Q98NA.png" alt="랏코">랏코</button><button class="choice " data-pet="shisa"><img src="https://gl.chiikawa-pocket.com/ko/_astro/Shisa.CnUn8FNQ.png" alt="시사">시사</button></div>
<div class="section">🍓 돌봐주기</div><div class="actions"><button class="act" id="feed"><span>🍙</span>밥 주기</button><button class="act" id="snack"><span>🍮</span>간식</button><button class="act" id="petting"><span>💗</span>쓰다듬기</button><button class="act" id="play"><span>🧸</span>놀아주기</button></div>
<div class="meters"><div class="meter"><span>🍚 배부름</span><div class="bar"><div class="fill" id="hungerBar"></div></div><span id="hungerNum">70</span></div><div class="meter"><span>😊 행복</span><div class="bar"><div class="fill" id="happyBar"></div></div><span id="happyNum">70</span></div><div class="meter"><span>⚡ 기운</span><div class="bar"><div class="fill" id="energyBar"></div></div><span id="energyNum">70</span></div></div><div class="log" id="log">안녕! 나를 터치해 줘! 밥도 먹고 같이 놀자! 🌸</div></section></main>
<script>
const $=id=>document.getElementById(id),names={chi:"치이카와",hachi:"하치와레",usagi:"우사기",momonga:"모몽가",kuri:"쿠리만쥬",rakko:"랏코",shisa:"시사"};let kind="chi",hunger=70,happy=70,energy=70,xp=0,level=1,coins=20,timer;
function clamp(n){return Math.max(0,Math.min(100,n))}function update(){for(let [id,v] of [["hunger",hunger],["happy",happy],["energy",energy]]){$(id+"Bar").style.width=v+"%";$(id+"Num").textContent=Math.round(v)}$("level").textContent="Lv. "+level;$("xp").textContent=xp+" / "+(level*30);$("coins").textContent=coins}
function say(t,em=""){ $("log").textContent=t+(em?" "+em:"");$("bubble").textContent=em||"고마워!";$("bubble").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("bubble").classList.remove("show"),1500)}
function gain(n){xp+=n;while(xp>=level*30){xp-=level*30;level++;coins+=10;say("레벨 업! 코인 10개를 받았어!","🎉")}}
function care(a){if(a==="feed"){if(coins<3)return say("코인이 부족해! 쓰다듬기로 모아봐.");if(hunger>97)return say("배가 너무 불러서 더 못 먹겠대!","😋");coins-=3;hunger=clamp(hunger+28);happy=clamp(happy+5);gain(5);say("냠냠! 맛있게 먹었어!","🍙")}
if(a==="snack"){if(coins<5)return say("코인이 부족해! 펫을 돌봐서 모아봐.");coins-=5;hunger=clamp(hunger+15);happy=clamp(happy+18);gain(7);say("달콤한 간식이다! 최고야!","🍮")}
if(a==="pet"){happy=clamp(happy+12);energy=clamp(energy+3);coins+=2;gain(3);say("쓰담쓰담~ 기분이 좋아졌어! 코인 +2","💗")}
if(a==="play"){if(energy<12)return say("조금 피곤해 보여. 쉬게 해줘!","😴");energy=clamp(energy-12);happy=clamp(happy+20);hunger=clamp(hunger-5);coins+=3;gain(8);say("우와! 같이 노니까 신난다! 코인 +3","🎉")}update()}
$("feed").onclick=()=>care("feed");$("snack").onclick=()=>care("snack");$("petting").onclick=()=>care("pet");$("play").onclick=()=>care("play");
$("pet").addEventListener("pointerdown",e=>{e.preventDefault();care("pet");$("pet").animate([{transform:"scale(1)"},{transform:"scale(1.1) rotate(-4deg)"},{transform:"scale(1)"}],{duration:260})});
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{kind=b.dataset.pet;document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("active",x===b));$("pet").className="pet "+kind;$("petImage").src="https://gl.chiikawa-pocket.com/ko/_astro/Chiikawa.oi0RVduO.png";const portraits={"chi":"https://gl.chiikawa-pocket.com/ko/_astro/Chiikawa.oi0RVduO.png","hachi":"https://gl.chiikawa-pocket.com/ko/_astro/Hachiware.OfZO944x.png","usagi":"https://gl.chiikawa-pocket.com/ko/_astro/Usagi.Chj2eKjw.png","momonga":"https://gl.chiikawa-pocket.com/ko/_astro/Momonga.BiBEJv7n.png","kuri":"https://gl.chiikawa-pocket.com/ko/_astro/Kurimanju.ujk7zWOw.png","rakko":"https://gl.chiikawa-pocket.com/ko/_astro/Rakko.BT9Q98NA.png","shisa":"https://gl.chiikawa-pocket.com/ko/_astro/Shisa.CnUn8FNQ.png"};$("petImage").src=portraits[kind];$("petImage").alt=names[kind]+" 공식 캐릭터 이미지";$("petName").textContent=names[kind];say(names[kind]+"와 함께 놀자!","🌸")});
setInterval(()=>{hunger=clamp(hunger-1);energy=clamp(energy-.5);if(hunger<25)happy=clamp(happy-1);update()},9000);update();
</script></body></html>
